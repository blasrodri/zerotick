[package]
name = "mock-usdc"
version = "0.1.0"
edition = "2024"
description = "TEST-ONLY minimal NEP-141 token for ZeroTick sandbox tests. Anyone can mint. Never deploy as a real asset."
license = "MIT"

[lib]
name = "mock_usdc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
near-sdk = "5.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
